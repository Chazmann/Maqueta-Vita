<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo con Radio Buttons y Reset</title>
    <!-- Cargar la última versión de Bootstrap desde el CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <!-- Primer contenedor con radio buttons -->
    <div class="comboRadiobuttons mb-4">
        <h4>Contenedor 1: Opciones</h4>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="opciones1" id="opcion1" value="1">
            <label class="form-check-label" for="opcion1">Opción 1</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="opciones1" id="opcion2" value="2">
            <label class="form-check-label" for="opcion2">Opción 2</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="opciones1" id="desmarcar" value="none">
            <label class="form-check-label" for="desmarcar">Desmarcar</label>
        </div>
    </div>

    <!-- Segundo contenedor con radio buttons y botón de reset -->
    <div class="comboRadiobuttons">
        <h4>Contenedor 2: Opciones con reset</h4>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="opciones2" id="opcion3" value="3">
            <label class="form-check-label" for="opcion3">Opción 3</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="opciones2" id="opcion4" value="4">
            <label class="form-check-label" for="opcion4">Opción 4</label>
        </div>
        <!-- Botón para resetear radio buttons -->
        <button id="resetR-button" class="btn btn-warning mt-3">Resetear</button>
    </div>
</div>

<!-- Cargar jQuery y Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Función para resetear los radio buttons
    function resetRadioButtonsOnError(button) {
        let comboContainer = $(button).closest('.comboRadiobuttons');
        comboContainer.find('input[type="radio"]').each(function () {
            $(this).val('false');
            $(this).prop('checked', false);
        });
    }

    // Evento para aplicar la función de reset al hacer clic en el botón
    $('.comboRadiobuttons #resetR-button').on('click', function () {
        resetRadioButtonsOnError(this);
    });
</script>

</body>
</html>
